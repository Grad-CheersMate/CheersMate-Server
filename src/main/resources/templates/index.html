<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheers Mate - AI 주류 & 안주 추천</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        /* 오른쪽 상단에 위치하기 위한 스타일 */
        .btn-group-top {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px; /* 버튼 간 간격 */
        }
    </style>
</head>
<body>

<!-- 오른쪽 상단에 위치한 버튼 그룹 -->
<div class="btn-group-top">
    <a href="/download" class="btn btn-outline-secondary">앱 다운로드</a>
    <a href="/auth/login" class="btn btn-outline-primary">관리자 콘솔</a>
</div>

<div class="container text-center mt-5">
    <h1 class="display-4 fw-bold text-primary">Cheers Mate</h1>
    <p class="lead">AI를 활용해 맞춤형 주류와 안주를 추천해드립니다.</p>

    <div class="row mt-5">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm rounded">
                <h5 class="card-title text-primary">개인 맞춤형 주류 추천</h5>
                <p class="card-text">AI가 사용자의 기호를 분석하여 최적의 주류를 추천합니다.</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm rounded">
                <h5 class="card-title text-primary">주류와 어울리는 안주 추천</h5>
                <p class="card-text">주류에 어울리는 다양한 안주 조합을 제안해드립니다.</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm rounded">
                <h5 class="card-title text-primary">새로운 경험과 레시피 제공</h5>
                <p class="card-text">새로운 조합과 특별한 경험을 위한 추천을 받아보세요.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
