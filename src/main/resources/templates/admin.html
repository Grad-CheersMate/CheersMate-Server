<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Cheers Mate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        #feedbackCharts {
            display: none; /* 기본적으로 차트를 숨김 */
        }
    </style>
</head>
<body>

<!-- 로그아웃 버튼 -->
<a href="#" class="btn btn-outline-danger logout-btn" onclick="logout()">로그아웃</a>

<div class="container mt-5">
    <h2 class="text-center">관리자 콘솔</h2>
    <p class="text-center">사용자, 주류, 음식, 피드백 관리</p>

    <!-- 카테고리 탭 -->
    <ul class="nav nav-tabs" id="adminTabs">
        <li class="nav-item">
            <a class="nav-link active" href="#user" onclick="showCategory('user')">사용자</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#liquor" onclick="showCategory('liquor')">주류</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#food" onclick="showCategory('food')">음식</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#feedback" onclick="showCategory('feedback')">피드백</a>
        </li>
    </ul>

    <!-- 콘텐츠 영역 -->
    <div id="content" class="mt-4">
        <!-- 테이블 -->
        <div id="dataTableContainer">
            <h3 id="categoryTitle"></h3>
            <table id="dataTable" class="table table-striped">
                <thead>
                <tr id="tableHeaders"></tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="pagination" class="mt-3"></div>
        </div>

        <!-- 피드백 통계 차트 -->
        <div id="feedbackCharts">
            <h3>피드백 통계</h3>
            <p id="averageRating"></p>
            <canvas id="feedbackChart"></canvas>
            <div class="chart-description">
                <strong>차트 설명:</strong>
                <ul>
                    <li>X축: 감정(Emotion)과 날씨(Weather) 조합</li>
                    <li>Y축: 피드백의 개수</li>
                    <li>
                        막대 색상:
                        <span style="color: green;">녹색(Green)</span>: 긍정적 피드백 (Positive),
                        <span style="color: red;">빨간색(Red)</span>: 부정적 피드백 (Negative)
                    </li>
                    <li>특정 조합에서 긍정적 피드백과 부정적 피드백의 비율을 확인 가능</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 로그아웃 기능
    function logout() {
        const refreshToken = localStorage.getItem('refreshToken');
        if (!refreshToken) {
            alert('이미 로그아웃 되었습니다.');
            window.location.href = '/auth/login';
            return;
        }

        fetch('/users/logout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${refreshToken}`
            },
        })
            .then(response => {
                if (!response.ok) throw new Error('로그아웃 실패');
                return response.json();
            })
            .then(data => {
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
                alert('로그아웃 되었습니다.');
                window.location.href = '/auth/login';
            })
            .catch(error => {
                console.error(error);
                alert('로그아웃 중 오류가 발생했습니다.');
            });
    }

    // 카테고리별 로드 함수
    const categoryLoaders = {
        user: loadUsers,
        liquor: loadLiquors,
        food: loadFoods,
        feedback: loadFeedbackStatistics, // 피드백 전용
    };

    function showCategory(category) {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/auth/login';
            return;
        }

        // 탭 상태 변경
        document.querySelectorAll('#adminTabs .nav-link').forEach(link => link.classList.remove('active'));
        const activeTab = document.querySelector(`#adminTabs .nav-link[href='#${category}']`);
        if (activeTab) activeTab.classList.add('active');

        // DOM 초기화
        document.getElementById('dataTableContainer').style.display = category === 'feedback' ? 'none' : 'block';
        document.getElementById('feedbackCharts').style.display = category === 'feedback' ? 'block' : 'none';

        // 로더 호출
        const loader = categoryLoaders[category];
        if (loader) loader(token);
    }

    // 사용자 로드 함수
    function loadUsers(token) {
        const apiUrl = '/api/admin/users/page';
        const title = '사용자 관리';
        const headers = ['닉네임', '이메일', '전화번호', '권한'];

        updateCategoryTitleAndHeaders(title, headers);
        fetchDataAndRender(apiUrl, token, renderUserTable,'pageUsers');
    }

    // 주류 로드 함수
    function loadLiquors(token) {
        const apiUrl = '/api/admin/liquor/page';
        const title = '주류 관리';
        const headers = ['ID', '이름', '도수', '카테고리', '이미지 URL'];

        updateCategoryTitleAndHeaders(title, headers);
        fetchDataAndRender(apiUrl, token, renderLiquorTable, 'liquors');
    }

    // 음식 로드 함수
    function loadFoods(token) {
        const apiUrl = '/api/admin/food/page';
        const title = '음식 관리';
        const headers = ['ID', '이름', '카테고리', '이미지 URL'];

        updateCategoryTitleAndHeaders(title, headers);
        fetchDataAndRender(apiUrl, token, renderFoodTable, 'pageFoods');
    }

    async function loadFeedbackStatistics(token) {
        try {
            const apiUrl = '/api/admin/feedback';
            const response = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!response.ok) throw new Error('피드백 데이터를 가져오는 데 실패했습니다.');

            const statistics = await response.json();
            renderFeedbackStatistics(statistics);
        } catch (error) {
            console.error(error);
            alert('피드백 데이터를 로드하는 중 오류가 발생했습니다.');
        }
    }


    // 카테고리 제목 및 테이블 헤더 업데이트
    function updateCategoryTitleAndHeaders(title, headers) {
        document.getElementById('categoryTitle').textContent = title;
        const headersHtml = headers.map(header => `<th>${header}</th>`).join('');
        document.getElementById('tableHeaders').innerHTML = headersHtml;
    }

    // 테이블 데이터 렌더링
    function fetchDataAndRender(apiUrl, token, renderTableFn, dataKey = 'content', page = 0, size = 20) {
        fetch(`${apiUrl}?page=${page}&size=${size}`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(response => {
                if (!response.ok) throw new Error('데이터 로드 실패');
                return response.json();
            })
            .then(data => {
                const items = data[dataKey]?.content || [];
                const totalPages = data[dataKey]?.totalPages || 0;
                renderTableFn(items);
                renderPagination(totalPages, page, apiUrl, token, renderTableFn, dataKey);
            })
            .catch(error => {
                console.error(error);
                alert('데이터를 로드하는 중 오류가 발생했습니다.');
            });
    }


    // 사용자 테이블 렌더링
    function renderUserTable(users) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        users.forEach(user => {
            const row = `
            <tr>
                <td>${user.nickname || ''}</td>
                <td>${user.email || ''}</td>
                <td>${user.tell || ''}</td>
                <td>${user.role || ''}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editUser('${user.email}')">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.email}')">삭제</button>
                </td>
            </tr>
        `;
            tbody.innerHTML += row;
        });
    }

    // 주류 테이블 렌더링
    function renderLiquorTable(liquors) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        liquors.forEach(liquor => {
            const row = `
            <tr>
                <td>${liquor.id || ''}</td>
                <td>${liquor.name || ''}</td>
                <td>${liquor.volume || ''}</td>
                <td>${liquor.category || ''}</td>
                <td>
                    ${liquor.imageUrl ? `<a href="${liquor.imageUrl}" target="_blank">이미지 보기</a>` : ''}
                    <button class="btn btn-warning btn-sm" onclick="editLiquor(${liquor.id})">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteLiquor(${liquor.id})">삭제</button>
                </td>
            </tr>
        `;
            tbody.innerHTML += row;
        });
    }

    // 음식 테이블 렌더링
    function renderFoodTable(foods) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        foods.forEach(food => {
            const row = `
            <tr>
                <td>${food.id || ''}</td>
                <td>${food.name || ''}</td>
                <td>${food.category || ''}</td>
                <td>
                    ${food.imageUrl ? `<a href="${food.imageUrl}" target="_blank">이미지 보기</a>` : ''}
                    <button class="btn btn-warning btn-sm" onclick="editFood(${food.id})">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteFood(${food.id})">삭제</button>
                </td>
            </tr>
        `;
            tbody.innerHTML += row;
        });
    }

    // 전역 차트 인스턴스 저장소
    const chartInstances = {};

    // 피드백 통계 렌더링
    function renderFeedbackStatistics(data) {
        // 데이터 검증
        if (!data || !data.combinations || data.combinations.length === 0) {
            console.error('피드백 데이터가 비어 있습니다.');
            return;
        }

        const ctx = document.getElementById('feedbackChart').getContext('2d');
        const labels = data.combinations.map(comb => `(${comb.emotion}, ${comb.weatherCondition})`);
        const positiveData = data.combinations.map(comb => comb.positiveCount);
        const negativeData = data.combinations.map(comb => comb.negativeCount);

        // 기존 차트가 있다면 삭제
        destroyChart('feedbackChart');

        // 새로운 차트 생성 및 저장
        chartInstances['feedbackChart'] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Positive',
                        data: positiveData,
                        backgroundColor: 'rgba(75, 192, 192, 0.8)',
                    },
                    {
                        label: 'Negative',
                        data: negativeData,
                        backgroundColor: 'rgba(255, 99, 132, 0.8)',
                    },
                ],
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        stacked: true,
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                    },
                },
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Feedback Count by Emotion and Weather',
                    },
                },
            },
        });
    }

    // 기존 차트 파괴 함수
    function destroyChart(canvasId) {
        if (chartInstances[canvasId]) {
            chartInstances[canvasId].destroy(); // 기존 차트를 삭제
            chartInstances[canvasId] = null; // 인스턴스를 초기화
        }
    }

    function renderPagination(totalPages, currentPage, apiUrl, token, renderTableFn, dataKey) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        const maxVisiblePages = 5; // 한 번에 보여줄 최대 페이지 수
        const currentSet = Math.floor(currentPage / maxVisiblePages); // 현재 페이지 세트 계산
        const startPage = currentSet * maxVisiblePages; // 현재 세트의 시작 페이지
        const endPage = Math.min(startPage + maxVisiblePages, totalPages); // 현재 세트의 끝 페이지

        // 이전 버튼
        if (startPage > 0) {
            const prevButton = document.createElement('button');
            prevButton.textContent = '이전';
            prevButton.className = 'btn btn-sm btn-outline-secondary';
            prevButton.onclick = () =>
                fetchDataAndRender(apiUrl, token, renderTableFn, dataKey, startPage - 1, 20);
            paginationContainer.appendChild(prevButton);
        }

        // 페이지 번호 버튼
        for (let i = startPage; i < endPage; i++) {
            const button = document.createElement('button');
            button.textContent = i + 1;
            button.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
            button.onclick = () =>
                fetchDataAndRender(apiUrl, token, renderTableFn, dataKey, i, 20);
            paginationContainer.appendChild(button);
        }

        // 다음 버튼
        if (endPage < totalPages) {
            const nextButton = document.createElement('button');
            nextButton.textContent = '다음';
            nextButton.className = 'btn btn-sm btn-outline-secondary';
            nextButton.onclick = () =>
                fetchDataAndRender(apiUrl, token, renderTableFn, dataKey, endPage, 20);
            paginationContainer.appendChild(nextButton);
        }
    }

    // 초기 로드
    document.addEventListener('DOMContentLoaded', () => {
        showCategory('user'); // 기본 사용자 카테고리 로드
    });
</script>
</body>
</html>
